<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0" />
    <title>{{GAME_NAME}}</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="screen">
      <div class="shade"></div>
      <section class="content">
        <h1 class="title">{{TITLE_HTML}}</h1>
        <p class="tagline">Build turrets. Sink the fleet. Hold the line.</p>
        <button class="play" id="play" type="button">&#9654;&nbsp; PLAY</button>
        <p class="who" id="who"></p>
        <ol class="top" id="top" aria-label="Today's top players"></ol>
      </section>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
